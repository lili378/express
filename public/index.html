<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <div class="box">
            <div class="banner-img">
                <img src="" alt="cake image">
            </div>
            <nav>
                <a href="/">Home</a>
                <a href="/projects">Projects</a>
                <a href="/about">About</a>
                <a href="/guestbook">Guestbook</a>
                <a href="/space">NASA</a>
                <a href="/?theme=light">Light mode</a>
                <a href="/?theme=dark">Dark mode</a>
            </nav>
            <div class="card">
                <div class="login-card" id="login-section">
                    <h2>Acess the Shoutbox</h2>
                    <form id="login-form" action="/login" method="post" id="login-form">
                        <label for="password">Enter Password:</label>
                        <input type="password" id="password" name="password" placeholder="Enter password" required>
                        <label><input type="checkbox" name="rememberMe" />Remember me</label>
                        <button type="submit">Log in</button>
                    </form>
                </div>
                <p id="login-message" role="status"></p>
                <p id="status" role="status"></p>

                <button id="logout-button" type="button">Log out</button>

            </div>

        </div>
    </div>

    <script src="./login.js"></script>
    <script src="./logout.js"></script>
</body>

</html>

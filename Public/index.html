<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <div class="box">
            <div class="banner-img">
                <img src="https://substackcdn.com/image/fetch/$s_!GxWO!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F958167ae-bf15-405c-a11b-8fe00edb3c98_733x1303.jpeg"
                    alt="cake image">
            </div>
            <nav>
                <a href="/">Home</a>
                <a href="/projects">Projects</a>
                <a href="/about">About</a>
                <a href="/guestbook">Guestbook</a>
                <a href="/?theme=light">Light mode</a>
                <a href="/?theme=dark">Dark mode</a>
            </nav>
            <div class="card">
                <div class="login-card" id="login-section">
                    <h2>Acess the Shoutbox</h2>
                    <form id="login-form" action="/login" method="post" id="login-form">
                        <label for="password">Enter Password:</label>
                        <input type="password" id="password" name="password" placeholder="Enter password" required>
                        <label><input type="checkbox" name="rememberMe" />Remember me</label>
                        <button type="submit">Log in</button>
                    </form>
                </div>
                <p id="login-message" role="status"></p>
                <p id="status" role="status"></p>

                <button id="logout-button" type="button">Log out</button>

            </div>

        </div>
    </div>

    <script>
        const loginForm = document.querySelector('#login-form');
        const loginMessage = document.querySelector('#login-message');
        const status = document.querySelector('#status');
        const loginSection = document.querySelector('#login-section');

        async function checkAuthState() {
            try {
                const response = await fetch('/api/whoami');
                const data = await response.json();

                if (data.loggedIn) {
                    status.innerHTML = '<h1> Welcome back!</h1><a href="/dashboard">Dashboard</a>';
                    loginSection.hidden = true;
                    logoutButton.hidden = false;
                } else {
                    status.innerHTML = '';
                    loginSection.hidden = false;
                    loginButton.hidden = true;
                }
            } catch (error) {
                status.innerHTML = '';
                loginSection.hidden = false;
                logoutButton.hidden = true;
            }
        }

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const password = document.querySelector('#password').value;
            const rememberMe = event.target.rememberMe.checked;
            const response = await fetch(loginForm.action, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password, rememberMe })
            });
            const data = await response.json().catch(() => ({ success: false }));
            if (data.success) {
                loginMessage.textContent = 'Login successful!';
                loginForm.reset();
                await checkAuthState();
                window.location.href = data.redirect || '/';
            } else {
                loginMessage.textContent = data.error || 'Login failed. Please check your password.';
            }
        });
        const logoutButton = document.querySelector('#logout-button');
        logoutButton.addEventListener('click', async () => {
            const response = await fetch('/logout', {
                method: 'POST'
            });
            const data = await response.json().catch(() => ({ sucess: false }));
            if (data.sucess) {
                window.location.href = '/';
            }
        });


        checkAuthState();

    </script>
</body>

</html>
